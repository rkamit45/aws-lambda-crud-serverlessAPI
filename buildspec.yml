version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - java -version
      - mvn -version

  build:
    commands:
      - echo "Building application shaded JAR..."
      - mvn clean package -DskipTests

  post_build:
    commands:
      - echo "Deploying target/aws-lambda-example-1.0-SNAPSHOT-lambda-package.zip to AWS Lambda..."
      - aws lambda update-function-code --function-name course-service --zip-file fileb://target/aws-lambda-example-1.0-SNAPSHOT-lambda-package.zip
      - echo "Deployment complete!"

artifacts:
  files:
    - target/aws-lambda-example-1.0-SNAPSHOT-lambda-package.zip
    - template.yaml
  discard-paths: yes
