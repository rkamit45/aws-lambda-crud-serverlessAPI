version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - echo "Starting pre-build phase..."
      - java -version
      - mvn -version

  build:
    commands:
      - echo "Building Serverless Spring Boot shaded JAR..."
      - mvn clean package -Pshaded-jar -DskipTests

  post_build:
    commands:
      - echo "Build completed successfully."
      - echo "Locating generated JAR package..."
      - JAR_FILE=$(ls target/*.jar | grep -v "original-" | head -n 1)
      - echo "Deploying artifact $JAR_FILE to AWS Lambda..."
      - aws lambda update-function-code --function-name course-service --zip-file fileb://$JAR_FILE
      - echo "AWS Lambda function code updated successfully!"

artifacts:
  files:
    - target/*.jar
  discard-paths: yes
